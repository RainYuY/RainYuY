<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yukina — Distributed systems, open source, and agentic AI</title>
  <desc id="desc">A dark blue banner with Yukina's name and a network linking RPC, MCP, A2A, and open source.</desc>

  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#0C1830"/>
      <stop offset="1" stop-color="#111C3E"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="555" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68E1FD"/>
      <stop offset="0.5" stop-color="#72A5FF"/>
      <stop offset="1" stop-color="#B78CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(954 173) rotate(90) scale(245)">
      <stop stop-color="#3E7BFA" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#3E7BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8DB5F5" stroke-opacity="0.09"/>
    </pattern>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect x="700" y="-60" width="500" height="500" fill="url(#glow)"/>
    <circle cx="1160" cy="-14" r="180" fill="#A979FF" fill-opacity="0.06"/>
    <circle cx="615" cy="394" r="160" fill="#4BD9EC" fill-opacity="0.05"/>

    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <text x="70" y="75" fill="#7EDFF2" font-size="16" font-weight="650" letter-spacing="4">HELLO, I'M</text>
      <text x="67" y="153" fill="#F5F8FF" font-size="70" font-weight="750" letter-spacing="-2">Yukina</text>
      <rect x="70" y="177" width="485" height="4" rx="2" fill="url(#accent)"/>
      <text x="70" y="220" fill="#BAC9E5" font-size="21" font-weight="500">Distributed systems · Open source · Agentic AI</text>

      <g transform="translate(70 244)">
        <rect width="206" height="38" rx="19" fill="#122847" stroke="#67DDF3" stroke-opacity="0.45"/>
        <circle cx="22" cy="19" r="5" fill="#67DDF3"/>
        <text x="37" y="25" fill="#E6F8FF" font-size="15" font-weight="650">Apache Dubbo PMC</text>
      </g>

      <text x="70" y="322" fill="#8295B8" font-size="16">Building reliable bridges between services and agents.</text>

      <g stroke="#6EA8FF" stroke-opacity="0.55" stroke-width="1.5">
        <path d="M940 176L827 98"/>
        <path d="M940 176L1061 93"/>
        <path d="M940 176L1075 246"/>
        <path d="M940 176L821 262"/>
        <path d="M827 98L1061 93" stroke-opacity="0.18"/>
        <path d="M821 262L1075 246" stroke-opacity="0.18"/>
      </g>

      <g filter="url(#nodeGlow)">
        <circle cx="940" cy="176" r="51" fill="#102A50" stroke="#71DDF4" stroke-width="2"/>
        <circle cx="940" cy="176" r="42" stroke="#71DDF4" stroke-opacity="0.25"/>
      </g>
      <text x="940" y="171" fill="#FFFFFF" font-size="15" font-weight="750" text-anchor="middle" letter-spacing="1">SYSTEMS</text>
      <text x="940" y="193" fill="#8CE8F7" font-size="11" font-weight="650" text-anchor="middle" letter-spacing="2">ENGINEER</text>

      <g>
        <circle cx="827" cy="98" r="34" fill="#101E38" stroke="#719EFF"/>
        <text x="827" y="104" fill="#DDE7FF" font-size="14" font-weight="700" text-anchor="middle">RPC</text>

        <circle cx="1061" cy="93" r="34" fill="#101E38" stroke="#A98BFF"/>
        <text x="1061" y="99" fill="#E8E1FF" font-size="14" font-weight="700" text-anchor="middle">A2A</text>

        <circle cx="1075" cy="246" r="34" fill="#101E38" stroke="#6FDCEC"/>
        <text x="1075" y="252" fill="#DAF9FD" font-size="14" font-weight="700" text-anchor="middle">MCP</text>

        <circle cx="821" cy="262" r="34" fill="#101E38" stroke="#7DA7FF"/>
        <text x="821" y="267" fill="#E1E9FF" font-size="12" font-weight="700" text-anchor="middle">OSS</text>
      </g>

      <g fill="#77D9F3">
        <circle cx="876" cy="132" r="3"/>
        <circle cx="1004" cy="132" r="3"/>
        <circle cx="1009" cy="213" r="3"/>
        <circle cx="876" cy="222" r="3"/>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23.25" stroke="#87A9E6" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>
